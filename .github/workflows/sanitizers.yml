name: sanitizers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  asan-ubsan-lsan:
    name: ASan+UBSan+LSan (clang)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          # Dependency list mirrors .github/workflows/build.yml (minus
          # python/swig/doxygen, plus clang for the sanitizer runtime).
          sudo apt-get install -y --no-install-recommends \
            build-essential clang \
            libgdal-dev libtinyxml2-dev libeigen3-dev libgtest-dev \
            libboost-dev libgeos-dev libtbb-dev \
            gnuplot nlohmann-json3-dev \
            git cmake

          # Install gtest static libs (matches build.yml recipe).
          cd /usr/src/gtest
          sudo cmake CMakeLists.txt
          sudo make
          sudo cp lib/*.a /usr/lib/ 2>/dev/null || true
          sudo ln -sf /usr/lib/libgtest.a /usr/local/lib/libgtest.a || true
          sudo ln -sf /usr/lib/libgtest_main.a /usr/local/lib/libgtest_main.a || true

      - name: Configure OR-Tools
        shell: bash
        run: |
          wget https://github.com/google/or-tools/releases/download/v9.9/or-tools_amd64_ubuntu-22.04_cpp_v9.9.3963.tar.gz -q -O /tmp/ortools.tar.gz
          mkdir -p /tmp/ortools
          tar -zxf /tmp/ortools.tar.gz -C /tmp/ortools --strip-components=1
          sudo cp -r /tmp/ortools/bin/. /usr/bin
          sudo cp -r /tmp/ortools/include/. /usr/include
          sudo cp -r /tmp/ortools/lib/. /usr/lib
          sudo cp -r /tmp/ortools/lib/cmake/. /usr/share
          sudo cp -r /tmp/ortools/share/. /usr/share/ortools

      - name: Configure (sanitizers)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_SANITIZERS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_PYTHON=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DUSE_ORTOOLS_RELEASE=ON

      - name: Build
        run: cmake --build build-asan -j

      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=0:print_summary=1:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/cmake/lsan-suppressions.txt:print_suppressions=0"
        run: |
          # Load the GTEST_FILTER that excludes T-015 pre-existing
          # failures (see cmake/sanitizer-test-filter.txt + T-015 in
          # docs/audit/followups.md). Those tests are broken in the
          # non-sanitizer baseline too; tracked separately.
          GTEST_FILTER=$(grep -v '^#' cmake/sanitizer-test-filter.txt | tr -d '\n' | sed 's/[[:space:]]*$//')
          echo "Running ctest with GTEST_FILTER=${GTEST_FILTER}"
          export GTEST_FILTER
          ctest --test-dir build-asan --output-on-failure
