name: clang-tidy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  clang-tidy-diff:
    name: clang-tidy diff gate (HRD-02)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          # Toolchain + clang-tidy (the gate)
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            clang clang-tidy clang-tools \
            ca-certificates git wget
          # fields2cover library dependencies (mirrors .github/workflows/build.yml)
          sudo apt-get install -y --no-install-recommends \
            libboost-dev libeigen3-dev libgdal-dev libgeos-dev \
            libtbb-dev libgtest-dev libtinyxml2-dev nlohmann-json3-dev \
            gnuplot libpython3-dev python3 python3-pip

      - name: Install OR-Tools
        run: |
          wget https://github.com/google/or-tools/releases/download/v9.9/or-tools_amd64_ubuntu-24.04_cpp_v9.9.3963.tar.gz -q -O /tmp/ortools.tar.gz
          mkdir -p /tmp/ortools
          tar -zxf /tmp/ortools.tar.gz -C /tmp/ortools --strip-components=1
          sudo cp -r /tmp/ortools/bin/. /usr/bin
          sudo cp -r /tmp/ortools/include/. /usr/include
          sudo cp -r /tmp/ortools/lib/. /usr/lib
          sudo cp -r /tmp/ortools/lib/cmake/. /usr/share
          sudo mkdir -p /usr/share/ortools
          sudo cp -r /tmp/ortools/share/. /usr/share/ortools

      - name: Configure CMake (compile_commands.json)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_PYTHON=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DBUILD_DOC=OFF \
            -DUSE_ORTOOLS_RELEASE=ON

      - name: Build (generate any codegen headers clang-tidy needs)
        run: cmake --build build -j

      - name: Run clang-tidy diff gate
        run: ./scripts/clang-tidy-diff.sh
