openapi: 3.0.3
info:
  description: |
    API for coverage path planning for agricultural robots.
    Based on Fields2Cover library - a complete coverage path planning library.
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  title: Fields2Cover API
  version: 1.0.0
servers:
  - description: Local development server
    url: http://localhost:8080/api/v1
tags:
  - description: Field data import operations
    name: Parser
  - description: Field manipulation operations
    name: Field
  - description: Coordinate transformation operations
    name: Transform
  - description: Robot configuration
    name: Robot
  - description: Headland generation
    name: Headland
  - description: Swath generation
    name: Swath
  - description: Route planning and swath ordering
    name: Route
  - description: Path planning
    name: Path
paths:
  /field/clone:
    post:
      description: Create a deep copy of a field object
      operationId: clone_field
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Field"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
          description: Field successfully cloned
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad request - invalid input
      summary: Clone a field
      tags:
        - Field
      x-openapi-router-controller: openapi_server.controllers.field_controller
  /headland/generate:
    post:
      description: Generate constant-width headland areas for a field
      operationId: generate_headlands
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/generateHeadlands_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cells"
          description: Headlands successfully generated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad request - invalid input
      summary: Generate headlands
      tags:
        - Headland
      x-openapi-router-controller: openapi_server.controllers.headland_controller
  /parser/import-field-gml:
    post:
      description: Import field geometry from a GML/XML file
      operationId: import_field_gml
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/importFieldGml_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
          description: Field successfully imported
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad request - invalid input
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Resource not found
      summary: Import field from GML file
      tags:
        - Parser
      x-openapi-router-controller: openapi_server.controllers.parser_controller
  /path/plan:
    post:
      description: Plan complete coverage path using specified turning algorithm
      operationId: plan_path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/planPath_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Path"
          description: Path successfully planned
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad request - invalid input
      summary: Plan coverage path
      tags:
        - Path
      x-openapi-router-controller: openapi_server.controllers.path_controller
  /robot/create:
    post:
      description: Create a robot with specified width and coverage width
      operationId: create_robot
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createRobot_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Robot"
          description: Robot successfully created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad request - invalid input
      summary: Create robot configuration
      tags:
        - Robot
      x-openapi-router-controller: openapi_server.controllers.robot_controller
  /route/sort-swaths:
    post:
      description: Sort swaths using snake order pattern
      operationId: sort_swaths
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/sortSwaths_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Swaths"
          description: Swaths successfully sorted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad request - invalid input
      summary: Sort swaths
      tags:
        - Route
      x-openapi-router-controller: openapi_server.controllers.route_controller
  /swath/generate:
    post:
      description: Generate coverage swaths using brute force algorithm
      operationId: generate_swaths
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/generateSwaths_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Swaths"
          description: Swaths successfully generated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad request - invalid input
      summary: Generate swaths
      tags:
        - Swath
      x-openapi-router-controller: openapi_server.controllers.swath_controller
  /transform/to-previous-crs:
    post:
      description: Transform path back to the original coordinate reference system
      operationId: transform_to_prev_crs
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/transformToPrevCRS_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Path"
          description: Path successfully transformed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad request - invalid input
      summary: Transform to previous CRS
      tags:
        - Transform
      x-openapi-router-controller: openapi_server.controllers.transform_controller
  /transform/to-utm:
    post:
      description: Transform field from GPS/geographic coordinates to UTM projection
      operationId: transform_to_utm
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/transformToUTM_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
          description: Field successfully transformed to UTM
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad request - invalid input
      summary: Transform field to UTM coordinates
      tags:
        - Transform
      x-openapi-router-controller: openapi_server.controllers.transform_controller
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Bad request - invalid input
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Resource not found
  schemas:
    Field:
      example:
        area: 5.637376656633329
        cells:
          cells:
            - area: 5.962133916683182
              outerRing:
                points:
                  - x: 0.8008281904610115
                    "y": 6.027456183070403
                    z: 1.4658129805029452
                  - x: 0.8008281904610115
                    "y": 6.027456183070403
                    z: 1.4658129805029452
              innerRings:
                - points:
                    - x: 0.8008281904610115
                      "y": 6.027456183070403
                      z: 1.4658129805029452
                    - x: 0.8008281904610115
                      "y": 6.027456183070403
                      z: 1.4658129805029452
                - points:
                    - x: 0.8008281904610115
                      "y": 6.027456183070403
                      z: 1.4658129805029452
                    - x: 0.8008281904610115
                      "y": 6.027456183070403
                      z: 1.4658129805029452
            - area: 5.962133916683182
              outerRing:
                points:
                  - x: 0.8008281904610115
                    "y": 6.027456183070403
                    z: 1.4658129805029452
                  - x: 0.8008281904610115
                    "y": 6.027456183070403
                    z: 1.4658129805029452
              innerRings:
                - points:
                    - x: 0.8008281904610115
                      "y": 6.027456183070403
                      z: 1.4658129805029452
                    - x: 0.8008281904610115
                      "y": 6.027456183070403
                      z: 1.4658129805029452
                - points:
                    - x: 0.8008281904610115
                      "y": 6.027456183070403
                      z: 1.4658129805029452
                    - x: 0.8008281904610115
                      "y": 6.027456183070403
                      z: 1.4658129805029452
        crs: crs
        id: id
      properties:
        id:
          description: Field identifier
          title: id
          type: string
        crs:
          description:
            "Coordinate reference system (e.g., \"EPSG:4258\", \"EPSG:28992\"\
            )"
          title: crs
          type: string
        cells:
          $ref: "#/components/schemas/Cells"
        area:
          description: Field area in square meters
          format: double
          title: area
          type: number
      title: Field
      type: object
    Cells:
      description: Collection of cell geometries
      example:
        cells:
          - area: 5.962133916683182
            outerRing:
              points:
                - x: 0.8008281904610115
                  "y": 6.027456183070403
                  z: 1.4658129805029452
                - x: 0.8008281904610115
                  "y": 6.027456183070403
                  z: 1.4658129805029452
            innerRings:
              - points:
                  - x: 0.8008281904610115
                    "y": 6.027456183070403
                    z: 1.4658129805029452
                  - x: 0.8008281904610115
                    "y": 6.027456183070403
                    z: 1.4658129805029452
              - points:
                  - x: 0.8008281904610115
                    "y": 6.027456183070403
                    z: 1.4658129805029452
                  - x: 0.8008281904610115
                    "y": 6.027456183070403
                    z: 1.4658129805029452
          - area: 5.962133916683182
            outerRing:
              points:
                - x: 0.8008281904610115
                  "y": 6.027456183070403
                  z: 1.4658129805029452
                - x: 0.8008281904610115
                  "y": 6.027456183070403
                  z: 1.4658129805029452
            innerRings:
              - points:
                  - x: 0.8008281904610115
                    "y": 6.027456183070403
                    z: 1.4658129805029452
                  - x: 0.8008281904610115
                    "y": 6.027456183070403
                    z: 1.4658129805029452
              - points:
                  - x: 0.8008281904610115
                    "y": 6.027456183070403
                    z: 1.4658129805029452
                  - x: 0.8008281904610115
                    "y": 6.027456183070403
                    z: 1.4658129805029452
      properties:
        cells:
          items:
            $ref: "#/components/schemas/Cell"
          title: cells
          type: array
      title: Cells
      type: object
    Cell:
      description: Single cell polygon geometry
      example:
        area: 5.962133916683182
        outerRing:
          points:
            - x: 0.8008281904610115
              "y": 6.027456183070403
              z: 1.4658129805029452
            - x: 0.8008281904610115
              "y": 6.027456183070403
              z: 1.4658129805029452
        innerRings:
          - points:
              - x: 0.8008281904610115
                "y": 6.027456183070403
                z: 1.4658129805029452
              - x: 0.8008281904610115
                "y": 6.027456183070403
                z: 1.4658129805029452
          - points:
              - x: 0.8008281904610115
                "y": 6.027456183070403
                z: 1.4658129805029452
              - x: 0.8008281904610115
                "y": 6.027456183070403
                z: 1.4658129805029452
      properties:
        outerRing:
          $ref: "#/components/schemas/LinearRing"
        innerRings:
          items:
            $ref: "#/components/schemas/LinearRing"
          title: innerRings
          type: array
        area:
          format: double
          title: area
          type: number
      title: Cell
      type: object
    LinearRing:
      example:
        points:
          - x: 0.8008281904610115
            "y": 6.027456183070403
            z: 1.4658129805029452
          - x: 0.8008281904610115
            "y": 6.027456183070403
            z: 1.4658129805029452
      properties:
        points:
          items:
            $ref: "#/components/schemas/Point"
          title: points
          type: array
      title: LinearRing
      type: object
    Point:
      example:
        x: 0.8008281904610115
        "y": 6.027456183070403
        z: 1.4658129805029452
      properties:
        x:
          format: double
          title: x
          type: number
        "y":
          format: double
          title: "y"
          type: number
        z:
          default: 0.0
          format: double
          title: z
          type: number
      required:
        - x
        - "y"
      title: Point
      type: object
    Robot:
      example:
        maxCurvature: 5.962133916683182
        maxDiffCurvature: 5.637376656633329
        coverageWidth: 6.027456183070403
        minTurningRadius: 1.4658129805029452
        robotWidth: 0.8008281904610115
        cruiseVelocity: 2.3021358869347655
      properties:
        robotWidth:
          description: Robot width in meters
          format: double
          title: robotWidth
          type: number
        coverageWidth:
          description: Working/coverage width in meters
          format: double
          title: coverageWidth
          type: number
        minTurningRadius:
          description: Minimum turning radius in meters
          format: double
          title: minTurningRadius
          type: number
        maxCurvature:
          description: Maximum curvature (1/radius)
          format: double
          title: maxCurvature
          type: number
        maxDiffCurvature:
          description: Maximum curvature change rate
          format: double
          title: maxDiffCurvature
          type: number
        cruiseVelocity:
          description: Cruise velocity in m/s
          format: double
          title: cruiseVelocity
          type: number
      required:
        - coverageWidth
        - robotWidth
      title: Robot
      type: object
    Swaths:
      example:
        swaths:
          - path:
              points:
                - x: 0.8008281904610115
                  "y": 6.027456183070403
                  z: 1.4658129805029452
                - x: 0.8008281904610115
                  "y": 6.027456183070403
                  z: 1.4658129805029452
            width: 0.8008281904610115
            id: 6
          - path:
              points:
                - x: 0.8008281904610115
                  "y": 6.027456183070403
                  z: 1.4658129805029452
                - x: 0.8008281904610115
                  "y": 6.027456183070403
                  z: 1.4658129805029452
            width: 0.8008281904610115
            id: 6
      properties:
        swaths:
          items:
            $ref: "#/components/schemas/Swath"
          title: swaths
          type: array
      title: Swaths
      type: object
    Swath:
      example:
        path:
          points:
            - x: 0.8008281904610115
              "y": 6.027456183070403
              z: 1.4658129805029452
            - x: 0.8008281904610115
              "y": 6.027456183070403
              z: 1.4658129805029452
        width: 0.8008281904610115
        id: 6
      properties:
        path:
          $ref: "#/components/schemas/LineString"
        width:
          format: double
          title: width
          type: number
        id:
          title: id
          type: integer
      title: Swath
      type: object
    LineString:
      example:
        points:
          - x: 0.8008281904610115
            "y": 6.027456183070403
            z: 1.4658129805029452
          - x: 0.8008281904610115
            "y": 6.027456183070403
            z: 1.4658129805029452
      properties:
        points:
          items:
            $ref: "#/components/schemas/Point"
          title: points
          type: array
      title: LineString
      type: object
    Path:
      example:
        length: 5.637376656633329
        states:
          - length: 1.4658129805029452
            angle: 0.8008281904610115
            velocity: 6.027456183070403
            type: DRIVE
            point:
              x: 0.8008281904610115
              "y": 6.027456183070403
              z: 1.4658129805029452
            curvature: 5.962133916683182
          - length: 1.4658129805029452
            angle: 0.8008281904610115
            velocity: 6.027456183070403
            type: DRIVE
            point:
              x: 0.8008281904610115
              "y": 6.027456183070403
              z: 1.4658129805029452
            curvature: 5.962133916683182
      properties:
        states:
          items:
            $ref: "#/components/schemas/PathState"
          title: states
          type: array
        length:
          description: Total path length in meters
          format: double
          title: length
          type: number
      title: Path
      type: object
    PathState:
      example:
        length: 1.4658129805029452
        angle: 0.8008281904610115
        velocity: 6.027456183070403
        type: DRIVE
        point:
          x: 0.8008281904610115
          "y": 6.027456183070403
          z: 1.4658129805029452
        curvature: 5.962133916683182
      properties:
        point:
          $ref: "#/components/schemas/Point"
        angle:
          description: Heading angle in radians
          format: double
          title: angle
          type: number
        velocity:
          format: double
          title: velocity
          type: number
        length:
          description: Cumulative length to this point
          format: double
          title: length
          type: number
        type:
          enum:
            - DRIVE
            - TURN
            - SWATH
          title: type
          type: string
        curvature:
          format: double
          title: curvature
          type: number
      title: PathState
      type: object
    VisualizationLayer:
      properties:
        type:
          enum:
            - FIELD
            - CELLS
            - PATH
            - SWATHS
            - ROUTE
          title: type
          type: string
        data:
          description: Geometry data to visualize
          title: data
          type: object
      required:
        - data
        - type
      title: VisualizationLayer
      type: object
    Error:
      example:
        code: code
        details: details
        message: message
      properties:
        code:
          title: code
          type: string
        message:
          title: message
          type: string
        details:
          title: details
          type: string
      required:
        - code
        - message
      title: Error
      type: object
    importFieldGml_request:
      properties:
        filePath:
          description: Path to the GML/XML file
          example: data/test1.xml
          title: filePath
          type: string
      required:
        - filePath
      title: importFieldGml_request
      type: object
    transformToUTM_request:
      properties:
        field:
          $ref: "#/components/schemas/Field"
        isETRS89:
          default: true
          description: Use ETRS89 datum (default true)
          title: isETRS89
          type: boolean
      required:
        - field
      title: transformToUTM_request
      type: object
    createRobot_request:
      properties:
        robotWidth:
          description: Robot width in meters
          example: 2.0
          format: double
          title: robotWidth
          type: number
        coverageWidth:
          description: Coverage/working width in meters
          example: 6.0
          format: double
          title: coverageWidth
          type: number
        minTurningRadius:
          description: Minimum turning radius in meters
          example: 2.0
          format: double
          title: minTurningRadius
          type: number
      required:
        - coverageWidth
        - robotWidth
      title: createRobot_request
      type: object
    generateHeadlands_request:
      properties:
        cells:
          $ref: "#/components/schemas/Cells"
        width:
          description: Headland width (typically 3.0 * robot width)
          example: 18.0
          format: double
          title: width
          type: number
      required:
        - cells
        - width
      title: generateHeadlands_request
      type: object
    generateSwaths_request:
      properties:
        angle:
          description: Swath angle in radians
          example: 3.14159
          format: double
          title: angle
          type: number
        width:
          description: Coverage width in meters
          example: 6.0
          format: double
          title: width
          type: number
        cells:
          $ref: "#/components/schemas/Cells"
      required:
        - angle
        - cells
        - width
      title: generateSwaths_request
      type: object
    sortSwaths_request:
      properties:
        swaths:
          $ref: "#/components/schemas/Swaths"
        variant:
          default: 0
          description: Sorting variant (0-3 for different start positions)
          maximum: 3
          minimum: 0
          title: variant
          type: integer
      required:
        - swaths
      title: sortSwaths_request
      type: object
    planPath_request:
      properties:
        robot:
          $ref: "#/components/schemas/Robot"
        swaths:
          $ref: "#/components/schemas/Swaths"
        turningAlgorithm:
          description: Path planning algorithm for turns
          enum:
            - DUBINS
            - DUBINS_CC
            - REEDS_SHEPP
            - REEDS_SHEPP_HC
          example: DUBINS
          title: turningAlgorithm
          type: string
      required:
        - robot
        - swaths
        - turningAlgorithm
      title: planPath_request
      type: object
    transformToPrevCRS_request:
      properties:
        path:
          $ref: "#/components/schemas/Path"
        field:
          $ref: "#/components/schemas/Field"
      required:
        - field
        - path
      title: transformToPrevCRS_request
      type: object
